services:
  backend:
    build:
      context: ./backend
    container_name: ai-writing-backend
    environment:
      # 旧 Python 参考服务专用；主后端使用下方 PostgreSQL DATABASE_URL。
      DATABASE_URL: ${PYTHON_DATABASE_URL:-sqlite+aiosqlite:////app/data/writing_platform.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ---- NestJS 后端（Phase 7 起作为主后端；Python 版保留为参考实现）----
  backend-ts:
    build:
      context: ./backend-ts
    container_name: ai-writing-backend-ts
    environment:
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/ai_writing}
      RUN_MIGRATIONS: "true"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  # ---- 开发库（pgvector 镜像：document_chunks.embedding 需要 vector 扩展）----
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-writing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_writing
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 只绑本机回环：供 host 侧跑 tools/import-sqlite.ts 等运维脚本
      # （不能用 5432，本机已有 Homebrew Postgres 占用）
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_writing"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- 测试库（vitest 连 localhost:5434；5433 常被本机其他项目占用）----
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: ai-writing-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_writing_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_writing_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: ai-writing-frontend
    volumes:
      # Phase 7 cutover：本地挂载覆盖镜像内的 nginx 配置，/api 转发到 NestJS。
      # frontend/ 目录零改动（git diff frontend/ 为空），切换只发生在部署层。
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-ts
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
