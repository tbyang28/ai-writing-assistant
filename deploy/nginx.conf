# 本地 cutover 用的 nginx 配置 —— 由 docker-compose 挂载进 frontend 容器
# （frontend/nginx.conf 保持不动，git diff frontend/ 为空）。
#
# 与原版唯一的差别：proxy_pass 指向 NestJS 后端且不带尾斜杠。
# 原版 `proxy_pass http://backend:8000/;` 的尾斜杠会把 /api 前缀剥掉，
# 后端又只注册 /api/* 路由 —— 本地组合其实一直是坏的，靠线上 VITE_API_URL
# 直连后端掩盖。不带尾斜杠则原样转发 /api/...，前后端路径终于对上。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend-ts:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
