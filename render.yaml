services:
  # API 已切换到 NestJS 版（backend-ts/）。Python/FastAPI 版保留在 backend/ 作为参考实现。
  # 部署前提：需要一个 Postgres（Render Postgres / Neon 等，需带 pgvector 扩展），
  # 并把连接串填进 DATABASE_URL 环境变量。
  - type: web
    name: ai-writing-assistant-api
    runtime: docker
    dockerfilePath: ./backend-ts/Dockerfile
    dockerContext: ./backend-ts
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false # postgres://...（需要 pgvector 扩展；启动时自动跑迁移）
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: SILICONFLOW_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-ai/DeepSeek-V4-Flash
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: 'https://.*\.(vercel\.app|onrender\.com)'

  - type: web
    name: ai-writing-assistant-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
